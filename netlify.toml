[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/edward-webhook"
  to = "/.netlify/functions/edward-webhook"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
